<!doctype html>
<html lang="ko" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>Lofree HUB</title><link rel="stylesheet" href="app.css"><link rel="stylesheet" href="instruments.css"><link rel="stylesheet" href="refinements.css"><link rel="stylesheet" href="instrument-motion.css"><link rel="stylesheet" href="page-motion.css"><link rel="stylesheet" href="seamless.css"><link rel="stylesheet" href="polish.css"><link rel="stylesheet" href="auto-apply.css"><script src="config.js" defer></script><script src="protocol.js" defer></script><script src="instruments.js" defer></script><script src="instrument-motion.js" defer></script><script src="page-motion.js" defer></script><script src="block-glow.js" defer></script><script src="live-apply.js" defer></script><script src="auto-ui.js" defer></script><script src="app.js" defer></script></head>
<body data-screen="landing"><header id="caption"><div class="caption-actions"><button data-caption="minimize" aria-label="최소화">─</button><button data-caption="maximize" aria-label="최대화">□</button><button data-caption="close" aria-label="닫기">×</button></div></header>
<section id="connectScreen" class="connect-screen" data-phase="idle" aria-labelledby="connectTitle">
 <header class="connect-heading"><h1 id="connectTitle">Hyzen 67</h1><p>USB · 2.4 GHz</p></header>
 <div class="connect-stage"><div class="connect-halo" aria-hidden="true"></div><div id="connectVisual"></div></div>
 <div class="connect-controls"><div class="connect-trace" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></div><button id="startConnect" class="connect-button" data-action="connect"><span id="connectMark" aria-hidden="true"></span><span id="startConnectLabel">연결</span></button><p id="connectStatus" role="status" aria-live="polite"></p></div>
</section>
<div class="shell" hidden inert><aside><div class="brand"><img id="brandLogo" class="brand-logo" src="lofree-logo.png" alt="Lofree" width="200" height="56" draggable="false"></div><nav id="nav" aria-label="메뉴"></nav><div class="sidebar-bottom"><button id="officialLink" class="text-button">공식 드라이버 ↗</button></div></aside>
<main><section id="connection" class="connection-row device-header" aria-label="키보드 연결 정보"><div class="connection-label"><span id="statusDot" class="status-dot"></span><div class="device-identity"><h1 id="pageTitle" tabindex="-1">Lofree HYZEN</h1><span id="pageContext" hidden></span><span id="deviceStatus" hidden>연결 대기</span></div></div><div class="connection-tools"><span id="connectionType" class="badge">연결 대기</span><select id="profileSelect" aria-label="프로필 선택" disabled></select><button id="refresh" class="icon-button" aria-label="장치 정보 새로고침"></button><button id="connect" class="primary">연결</button></div></section>
<div id="notice" role="status" class="notice" hidden></div><div id="content"></div><footer class="main-footer"><span id="syncStatus"></span><button id="retryApply" hidden>다시 적용</button></footer></main></div><div id="toast" role="status" hidden></div>
<dialog id="confirmDialog"><h2 id="confirmTitle"></h2><p id="confirmText"></p><div class="dialog-actions"><button id="cancelConfirm">취소</button><button id="acceptConfirm" class="primary">계속</button></div></dialog>
</body></html>
